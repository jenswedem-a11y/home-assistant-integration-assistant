services:
  smartguide-app:
    build: .
    container_name: smartguide-app
    restart: unless-stopped
    environment:
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
    volumes:
      - ./data:/app/data
    ports:
      - "${SMARTGUIDE_PORT:-8095}:8080"
